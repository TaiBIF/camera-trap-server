version: '3.7'

#volumes:
#  asset:

services:
  # Memory caps below keep one runaway request or task from starving the whole
  # host (31G, no swap). Without them the kernel OOM killer picks its own
  # victim, which has taken down postgres and nginx along with the culprit.
  django:
    build:
      context: .
      dockerfile: ./docker/Dockerfile_prod
    expose:
      - 8001
    command: /srv/start_prod
    restart: always
    mem_limit: 12g
  celery:
    mem_limit: 6g
  flower:
    mem_limit: 512m
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./docker/nginx-django.conf:/etc/nginx/conf.d/ct22.conf
      - ../ct22-volumes/static:/ct22-volumes/static
      - ../ct22-volumes/certbot/conf:/etc/letsencrypt
      - ../ct22-volumes/certbot/www:/var/www/certbot
      #- ../basdb-volumes/media:/basdb-volumes/media
      - ../ct22-volumes/logs/nginx:/var/log/nginx
      #- asset:/asset
    command: '/bin/sh -c ''while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''
    links:
      - django:django
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"
  certbot:
    image: certbot/certbot
    volumes:
      - ../ct22-volumes/certbot/conf:/etc/letsencrypt
      - ../ct22-volumes/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  redis:
    image: redis:6-alpine
    restart: always
